editor: source

execute:
  cache: false # "Danger, Will Robinson!"
  freeze: false # If you plan to use it, remember to disable it afterward!

project:
  type: website
  output-dir: docs
  render: [index.qmd]
  post-render: "R/.post-render.R"

title: >
  Differences Among Brazilian Children Aged 2 to 4 in Ultra-Processed Food
  Consumption in 2022 Between Municipalities in Clusters B and D of the Revised
  Multidimensional Index for Sustainable Food Systems (MISFS-R)
author: "Daniel Vartanian"
keyword: >
  Education, Nutrition, Children, Ultra-Processed Foods, MISFS, SISVAN, Brazil,
  Data Science, Data Visualization, Statistical Modeling, R Programming,
  rstats, Quarto, Reproducible Research, Open Science, Open Source
date: today
date-format: long

website:
  favicon: images/favicon.svg
  site-url: https://danielvartan.github.io/r-course-exercise/
  repo-url: https://github.com/danielvartan/r-course-exercise/
  issue-url: https://github.com/danielvartan/r-course-exercise/issues/
  open-graph:
    image: images/og-image.png
    image-width: 2400
    image-height: 1600
    image-alt: Center for Metropolitan Studies
  repo-branch: main
  repo-actions: [edit, source, issue]
  search: false
  navbar:
    title: false
    background: "#002554"
    right:
      - icon: github
        href: https://danielvartan.github.io/r-course-exercise/
        aria-label: GitHub

lightbox:
  match: auto
  effect: fade
  desc-position: bottom
  loop: false

format:
  html:
    toc: true
    toc-depth: 5
    toc-location: right
    locale: en
    language: en-us
    code-fold: false
    code-link: true
    code-tools: false
    df-print: paged
    fig-align: center
    cap-location: top
    lightbox: true
    callout-appearance: simple
    csl: csl/english-apa-author-date.csl
    theme: [cosmo, scss/styles.scss, brand]
    other-links:
      - text: Center for Metropolitan Studies
        href: https://centrodametropole.fflch.usp.br

google-scholar: true
bibliography: references.bib
